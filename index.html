<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Perfil profissional</title>
</head>

<body>

    <div class="perfil">

        <p class="imagem">Foto</p>

        <a href="" class="contato">Entrar em contato</a>

        <p class="usuario">Nome: Maria Silva</p>
        <p class="profissao">Cargo: Desenvolvedora Front-end</p>
        <p class="correio">E-mail: maria@exemplo.com</p>

        <p class="texto-inicial">
            Primeiro parágrafo, com margin-bottom de 40px.
        </p>

        <p class="texto-final">
            Segundo parágrafo, com margin-top de 20px.
            Repare que o espaço entre os dois é 40px, não 60px.
        </p>

        <div class="blocos">
            <p class="item um">1</p>
            <p class="item dois">2</p>
            <p class="item tres">3</p>
        </div>

    </div>

</body>
</html>
